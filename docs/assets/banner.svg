  <text x="582.5" y="290" text-anchor="middle" class="mono" font-size="13" fill="#34d399">read repair</text>
  <rect x="64" y="312" width="117" height="30" rx="15" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.55"/>
