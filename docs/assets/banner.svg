  <text x="312.5" y="290" text-anchor="middle" class="mono" font-size="13" fill="#a78bfa">vector clocks</text>
  <rect x="389" y="270" width="125" height="30" rx="15" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.55"/>
  <text x="451.5" y="290" text-anchor="middle" class="mono" font-size="13" fill="#fbbf24">N/W/R quorum</text>
