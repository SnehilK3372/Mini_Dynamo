  <rect x="191" y="312" width="141" height="30" rx="15" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.55"/>
  <text x="261.5" y="332" text-anchor="middle" class="mono" font-size="13" fill="#a78bfa">hinted handoff</text>
  <rect x="342" y="312" width="85" height="30" rx="15" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.55"/>
  <text x="384.5" y="332" text-anchor="middle" class="mono" font-size="13" fill="#fbbf24">RocksDB</text>
  <rect x="437" y="312" width="117" height="30" rx="15" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.55"/>
  <text x="495.5" y="332" text-anchor="middle" class="mono" font-size="13" fill="#34d399">JWT gateway</text>
