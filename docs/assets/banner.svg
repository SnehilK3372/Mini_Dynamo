  </circle>
  <circle cx="970.5" cy="63.7" r="8" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="823.2" cy="138.8" r="9" fill="none" stroke="#f8fafc" stroke-opacity="0.6">
