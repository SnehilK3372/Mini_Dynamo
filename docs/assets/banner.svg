  <text x="64" y="92" class="mono" font-size="14" letter-spacing="3" fill="#60a5fa">DISTRIBUTED KEY-VALUE STORE</text>
  <text x="62" y="160" class="sans" font-size="66" font-weight="800" fill="url(#titleFill)" letter-spacing="-1">Mini Dynamo</text>
  <text x="64" y="204" class="sans" font-size="22" fill="#cbd5e1">Amazon Dynamo&#8217;s design, built from scratch in C++17</text>
  <text x="64" y="234" class="sans" font-size="17" fill="#94a3b8">plus a Spring Boot + JWT gateway, Prometheus/Grafana and failure drills in CI</text>
