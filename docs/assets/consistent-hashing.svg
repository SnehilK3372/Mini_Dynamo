<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Consistent hashing: how Mini Dynamo picks the N replicas for a key">
  <title>Consistent hashing: how Mini Dynamo picks the N replicas for a key</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111b36"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowHi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2e8f0"/>
    </marker>
  </defs>
  <rect width="1200" height="600" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="600" rx="20" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="599" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="48" y="62" class="sans" font-size="26" font-weight="700" fill="#f1f5f9">How a key finds its replicas</text>
  <text x="48" y="90" class="sans" font-size="16" fill="#94a3b8">Consistent hashing with virtual nodes &#183; N = 3 replicas on 3 distinct machines</text>
  <circle cx="340" cy="330" r="190" fill="none" stroke="#334155" stroke-width="2.5"/>
  <path d="M 264.9 471.3 A 160 160 0 0 1 197.4 257.4" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowHi)"/>
  <text x="204.2" y="363.9" text-anchor="middle" class="sans" font-size="13" font-style="italic" fill="#cbd5e1" transform="rotate(-72 204.2 363.9)">walk clockwise</text>
  <circle cx="373" cy="142.9" r="14" fill="#0b1120" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="373" y="147.9" text-anchor="middle" class="mono" font-size="14" fill="#22d3ee">1</text>
  <circle cx="457" cy="180.3" r="14" fill="#0b1120" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="457" y="185.3" text-anchor="middle" class="mono" font-size="14" fill="#fbbf24">3</text>
  <circle cx="518.5" cy="265" r="14" fill="#0b1120" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="518.5" y="270" text-anchor="middle" class="mono" font-size="14" fill="#a78bfa">2</text>
  <circle cx="528.2" cy="356.4" r="14" fill="#0b1120" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="528.2" y="361.4" text-anchor="middle" class="mono" font-size="14" fill="#22d3ee">1</text>
  <circle cx="489.7" cy="447" r="14" fill="#0b1120" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="489.7" y="452" text-anchor="middle" class="mono" font-size="14" fill="#fbbf24">3</text>
  <circle cx="420.3" cy="502.2" r="14" fill="#0b1120" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="420.3" y="507.2" text-anchor="middle" class="mono" font-size="14" fill="#a78bfa">2</text>
  <circle cx="340" cy="520" r="14" fill="#0b1120" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="340" y="525" text-anchor="middle" class="mono" font-size="14" fill="#22d3ee">1</text>
  <circle cx="212.9" cy="471.2" r="22" fill="#a78bfa" fill-opacity="0.16"/>
  <circle cx="212.9" cy="471.2" r="14" fill="#a78bfa"/>
  <text x="212.9" y="476.2" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#0b1120">2</text>
  <text x="184.8" y="507.4" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#a78bfa">#1</text>
  <circle cx="166.4" cy="407.3" r="14" fill="#0b1120" stroke="#a78bfa" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="166.4" y="412.3" text-anchor="middle" class="mono" font-size="14" fill="#a78bfa" fill-opacity="0.6">2</text>
  <text x="139" y="415.5" text-anchor="end" class="sans" font-size="13" fill="#94a3b8">skip &#8212;</text>
  <text x="139" y="432.5" text-anchor="end" class="sans" font-size="13" fill="#94a3b8">node2 again</text>
  <circle cx="150" cy="330" r="22" fill="#fbbf24" fill-opacity="0.16"/>
  <circle cx="150" cy="330" r="14" fill="#fbbf24"/>
  <text x="150" y="335" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#0b1120">3</text>
  <text x="108" y="335" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#fbbf24">#2</text>
  <circle cx="175.5" cy="235" r="22" fill="#22d3ee" fill-opacity="0.16"/>
  <circle cx="175.5" cy="235" r="14" fill="#22d3ee"/>
  <text x="175.5" y="240" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#0b1120">1</text>
  <text x="139.1" y="219" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#22d3ee">#3</text>
  <circle cx="245" cy="165.5" r="14" fill="#0b1120" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="245" y="170.5" text-anchor="middle" class="mono" font-size="14" fill="#fbbf24">3</text>
  <rect x="250.7" y="493.2" width="18" height="18" rx="2" fill="#f8fafc" transform="rotate(45 259.7 502.2)" filter="url(#glow)"/>
  <text x="238.5" y="544.8" text-anchor="end" class="mono" font-size="14" fill="#e2e8f0">hash64("cart:42")</text>
  <text x="362" y="316" text-anchor="middle" class="sans" font-size="14" letter-spacing="1" fill="#94a3b8">PREFERENCE LIST</text>
  <text x="362" y="346" text-anchor="middle" class="mono" font-size="17" fill="#f1f5f9">[<tspan fill="#a78bfa">node2</tspan>, <tspan fill="#fbbf24">node3</tspan>, <tspan fill="#22d3ee">node1</tspan>]</text>
  <text x="362" y="372" text-anchor="middle" class="sans" font-size="13" fill="#64748b">#1 is the primary owner</text>
  <circle cx="165" cy="573" r="6" fill="#22d3ee"/>
  <text x="177" y="578" class="mono" font-size="13" fill="#94a3b8">node1</text>
  <circle cx="249" cy="573" r="6" fill="#a78bfa"/>
  <text x="261" y="578" class="mono" font-size="13" fill="#94a3b8">node2</text>
  <circle cx="333" cy="573" r="6" fill="#fbbf24"/>
  <text x="345" y="578" class="mono" font-size="13" fill="#94a3b8">node3</text>
  <text x="417" y="578" class="sans" font-size="13" fill="#64748b">(4 of 128 vnodes each shown)</text>
  <circle cx="676" cy="140" r="16" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee"/>
  <text x="676" y="145" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#22d3ee">1</text>
  <text x="706" y="146" class="sans" font-size="19" font-weight="700" fill="#f1f5f9">Hash the key</text>
  <text x="706" y="172" class="sans" font-size="15" fill="#94a3b8">hash64 (FNV-1a + a Murmur finalizer) puts the key</text>
  <text x="706" y="194" class="sans" font-size="15" fill="#94a3b8">on a 64-bit ring. The Java gateway runs a bit-for-bit</text>
  <text x="706" y="216" class="sans" font-size="15" fill="#94a3b8">port of it, so it can route straight to the owner.</text>
  <circle cx="676" cy="260" r="16" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"/>
  <text x="676" y="265" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#a78bfa">2</text>
  <text x="706" y="266" class="sans" font-size="19" font-weight="700" fill="#f1f5f9">Walk clockwise</text>
  <text x="706" y="292" class="sans" font-size="15" fill="#94a3b8">The first N distinct physical nodes past the key are</text>
  <text x="706" y="314" class="sans" font-size="15" fill="#94a3b8">its preference list. 128 vnodes per node spread load</text>
  <text x="706" y="336" class="sans" font-size="15" fill="#94a3b8">evenly; a join or leave moves only thin slices.</text>
  <circle cx="676" cy="380" r="16" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24"/>
  <text x="676" y="385" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#fbbf24">3</text>
  <text x="706" y="386" class="sans" font-size="19" font-weight="700" fill="#f1f5f9">Skip repeats</text>
  <text x="706" y="412" class="sans" font-size="15" fill="#94a3b8">A second vnode of an already-chosen node is passed</text>
  <text x="706" y="434" class="sans" font-size="15" fill="#94a3b8">over, so the N replicas always live on N machines.</text>
  <circle cx="676" cy="478" r="16" fill="#34d399" fill-opacity="0.15" stroke="#34d399"/>
  <text x="676" y="483" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#34d399">4</text>
  <text x="706" y="484" class="sans" font-size="19" font-weight="700" fill="#f1f5f9">Quorum</text>
  <text x="706" y="510" class="sans" font-size="15" fill="#94a3b8">The coordinator writes to all N and commits after W</text>
  <text x="706" y="532" class="sans" font-size="15" fill="#94a3b8">acks; reads wait for R replies. With W + R > N, every</text>
  <text x="706" y="554" class="sans" font-size="15" fill="#94a3b8">read quorum overlaps the latest write quorum.</text>
</svg>
