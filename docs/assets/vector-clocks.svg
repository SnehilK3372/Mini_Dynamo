<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Vector clocks: concurrent writes become siblings that the client reconciles">
  <title>Vector clocks: concurrent writes become siblings that the client reconciles</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111b36"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowHi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2e8f0"/>
    </marker>
  </defs>
  <rect width="1200" height="470" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="20" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="48" y="62" class="sans" font-size="26" font-weight="700" fill="#f1f5f9">Conflicts are detected, never silently overwritten</text>
  <text x="48" y="90" class="sans" font-size="16" fill="#94a3b8">Every version carries a vector clock &#183; concurrent writes surface as siblings</text>
  <rect x="48" y="196" width="180" height="74" rx="12" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="138.0" y="224" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#22d3ee">D1</text>
  <text x="138.0" y="250" text-anchor="middle" class="mono" font-size="15" fill="#f1f5f9">{node1:1}</text>
  <text x="138.0" y="294" text-anchor="middle" class="sans" font-size="14" fill="#94a3b8">PUT via node1</text>
  <rect x="318" y="122" width="230" height="74" rx="12" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="433.0" y="150" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#22d3ee">D2</text>
  <text x="433.0" y="176" text-anchor="middle" class="mono" font-size="15" fill="#f1f5f9">{node1:2}</text>
  <text x="433.0" y="220" text-anchor="middle" class="sans" font-size="14" fill="#94a3b8">client A &#183; via node1</text>
  <rect x="318" y="290" width="230" height="74" rx="12" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="433.0" y="318" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#a78bfa">D3</text>
  <text x="433.0" y="344" text-anchor="middle" class="mono" font-size="15" fill="#f1f5f9">{node1:1, node2:1}</text>
  <text x="433.0" y="388" text-anchor="middle" class="sans" font-size="14" fill="#94a3b8">client B &#183; via node2</text>
  <rect x="888" y="196" width="280" height="74" rx="12" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/>
  <text x="1028.0" y="224" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#fbbf24">D4</text>
  <text x="1028.0" y="250" text-anchor="middle" class="mono" font-size="15" fill="#f1f5f9">{node1:2, node2:1, node3:1}</text>
  <text x="1028.0" y="294" text-anchor="middle" class="sans" font-size="14" fill="#94a3b8">client merges both, writes via node3</text>
  <text x="1028.0" y="314" text-anchor="middle" class="sans" font-size="14" font-weight="600" fill="#34d399">dominates D2 and D3 &#10003;</text>
  <path d="M 232 233.0 C 273.0 233.0, 273.0 159.0, 312 159.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 232 233.0 C 273.0 233.0, 273.0 327.0, 312 327.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="367.0" y="245.0" width="132" height="26" rx="13" fill="#fb7185" fill-opacity="0.15" stroke="#fb7185" stroke-opacity="0.8"/>
  <text x="433.0" y="263.0" text-anchor="middle" class="mono" font-size="12" font-weight="700" letter-spacing="1" fill="#fb7185">CONCURRENT</text>
  <rect x="618" y="186" width="200" height="94" rx="12" fill="#fb7185" fill-opacity="0.06" stroke="#fb7185" stroke-opacity="0.5" stroke-dasharray="5 4"/>
  <text x="718.0" y="214" text-anchor="middle" class="mono" font-size="14" fill="#94a3b8">GET cart:42</text>
  <text x="718.0" y="240" text-anchor="middle" class="sans" font-size="17" font-weight="700" fill="#fb7185">409 Conflict</text>
  <text x="718.0" y="264" text-anchor="middle" class="mono" font-size="14" fill="#f1f5f9">siblings [D2, D3]</text>
  <path d="M 552 159.0 C 583.0 159.0, 583.0 217.0, 612 217.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 552 327.0 C 583.0 327.0, 583.0 249.0, 612 249.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 822 233.0 L 882 233.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600.0" y="440" text-anchor="middle" class="sans" font-size="14" fill="#64748b">A version dominates another when its clock is &#8805; in every entry. If neither dominates, both are kept and the client reconciles.</text>
</svg>
